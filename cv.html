<main>
<section class="section" id="cv">
  <div class="container">
    <p class="section-label">CV</p>
    <h2>Curriculum Vitae</h2>
    <div class="cv-frame">
      <iframe src="files/cv.pdf" title="Dakota Sullivan CV" loading="lazy" allow="autoplay"></iframe>
    </div>
    <div class="cv-pages" id="cv-pages" data-src="files/cv.pdf">
      <p class="cv-loading">Loading CV…</p>
    </div>
    <script type="module">
      // Phones only: draw each page of the CV scaled to fit the window (uses PDF.js by Mozilla)
      const box = document.getElementById('cv-pages');
      if (box && window.matchMedia('(max-width: 860px)').matches) {
        const base = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/legacy/build/';
        try {
          const pdfjs = await import(base + 'pdf.min.mjs');
          pdfjs.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.mjs';
          const pdf = await pdfjs.getDocument(box.dataset.src).promise;
          const width = box.clientWidth - 20;
          const dpr = window.devicePixelRatio || 1;
          box.querySelector('.cv-loading')?.remove();
          for (let n = 1; n <= pdf.numPages; n++) {
            const page = await pdf.getPage(n);
            const scale = width / page.getViewport({ scale: 1 }).width;
            const viewport = page.getViewport({ scale: scale * dpr });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            canvas.style.width = width + 'px';
            canvas.setAttribute('role', 'img');
            canvas.setAttribute('aria-label', 'CV page ' + n + ' of ' + pdf.numPages);
            box.appendChild(canvas);
            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
          }
          const link = document.createElement('p');
          link.className = 'cv-open';
          link.innerHTML = '<a href="' + box.dataset.src + '">Open full-size PDF</a>';
          box.appendChild(link);
        } catch (err) {
          box.innerHTML = '<p class="cv-loading">The preview couldn’t load. <a href="' + box.dataset.src + '">Open my CV (PDF)</a></p>';
        }
      }
    </script>
  </div>
</section>
</main>

<footer>
  <div class="container">
    <span>© 2026 Dakota Sullivan · Ph.D. Candidate · UW–Madison · Computer Sciences</span>
  </div>

</body>
